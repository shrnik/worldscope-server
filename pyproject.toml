[project]
name = "worldscope-server"
version = "1.0.0"
description = "Worldscope image search server (FastAPI + CLIP + HF Jobs)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "huggingface_hub>=1.21",
    "transformers>=4.46",
    "torch>=2.4",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pillow>=11.0",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "sentencepiece==0.2.0",
]

[tool.uv]
package = false
